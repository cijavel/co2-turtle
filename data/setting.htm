

<html>
    <head>
        <title>{{deviceName}} - Sensor Settings</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div class="container">
            <div class="nav">
                <a href="/" class="button">Back to Index</a>
            </div>
            <div class="content">
                <h1>Modul Switch</h1>
                <form action="/submitmodulswitch" method="POST">
                    <table class="content">
                        <tr>
                            <th><label for="switchWIFI">WiFi Check</label></th>
                            <td>
                                <input type="checkbox" id="switchWIFI" name="switchWIFI" value="switchWIFI" {{switchWIFI_checked}}  title="Check WLAN status">
                            </td>
                        </tr>
                        <tr>
                            <th><label for="switchEPD">EPD Display</label></th>
                            <td>
                                <input type="checkbox" id="switchEPD" name="switchEPD" value="switchEPD" {{switchEPD_checked}} title="Display sensor data on EPD">
                            </td>
                        </tr>
                        <tr>
                            <th><label for="switchLED">LED</label></th>
                            <td>
                                <input type="checkbox" id="switchLED" name="switchLED" value="switchLED" {{switchLED_checked}} title="Display sensor data on LED strips">
                            </td>
                        </tr>
                        <tr>
                            <th><label for="switchMQTT">MQTT</label></th>
                            <td>
                                <input type="checkbox" id="switchMQTT" name="switchMQTT" value="switchMQTT" {{switchMQTT_checked}} title="Send sensor data via MQTT">
                            </td>
                        </tr>
                    </table>
                    <input type="submit" value="Save Settings">
                </form>
                <h1>Modul Time Interval</h1>
                <form action="/submitmodulinterval" method="POST">
                        <table class="content">
                        <tr>
                            <th><label for="intervalMHZ19"19>MHZ19 Interval (s)</label></th>
                            <td><input type="number" id="intervalMHZ19" name="intervalMHZ19" value="{{intervalMHZ19}}"></td>
                        </tr><tr>
                            <th><label for="intervalBME680">BME680 Interval (s)</label></th>
                            <td><input type="number" id="intervalBME680" name="intervalBME680" value="{{intervalBME680}}"></td>
                        </tr><tr>
                            <th><label for="intervalWiFi">WiFi Check Interval (s)</label></th>
                            <td><input type="number" id="intervalWiFi" name="intervalWiFi" value="{{intervalWiFi}}"></td>
                        </tr><tr>
                            <th><label for="intervalPRINT">RAM Printout Interval (s)</label></th>
                            <td><input type="number" id="intervalPRINT" name="intervalPRINT" value="{{intervalPRINT}}"></td>
                        </tr><tr>
                            <th><label for="intervalEPD">EPD Refresh Interval (s)</label></th>
                            <td><input type="number" id="intervalEPD" name="intervalEPD" value="{{intervalEPD}}"></td>
                        </tr><tr>
                            <th><label for="intervalLED">LED Update Interval (s)</label></th>
                            <td><input type="number" id="intervalLED" name="intervalLED" value="{{intervalLED}}"></td>
                        </tr><tr>
                            <th><label for="intervalMQTT">MQTT Interval (s)</label></th>
                            <td><input type="number" id="intervalMQTT" name="intervalMQTT" value="{{intervalMQTT}}"></td>
                        </tr>
                    </table>
                    <input type="submit" value="Save Interval">
                </form>
                <h1>Settings Option</h1>
                <form action="/reset" method="POST">
                    <button type="submit">Reset ESP32</button>
                </form>
                <form action="/loaddefaultsettings" method="POST">
                    <button onclick="loadDefaults()">Load Default Settings</button>
                </form>
            </div>
        </div>
        <div class="footer">&copy; 2025 SensorTurtle</div>
    </body>
</html>
