<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{deviceName}}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>{{deviceName}}</h1>
    <div class="nav-group">
        <div class="nav">
            <a href="/status" class="button">Status</a>
            <a href="/json" class="button">JSON</a>
        </div>
        <div class="nav-label">Settings</div>
        <div class="nav">
            <a href="/sensorsettings" class="button">Sensor</a>
            <a href="/WLAN" class="button">WLAN</a>
            <a href="/mqtt" class="button">MQTT</a>
        </div>
    </div>
    <div class="content">
        <div id="warningBanner" style="display:none;background:#fff3cd;border:1px solid #ffc107;border-radius:5px;padding:15px;margin-top:20px;">
            <strong>⚠ BME680 sensor error</strong>
            <span id="warningText"></span>
            <div style="margin-top:10px;">
                <form action="/restart" method="POST" id="restartForm">
                    <button type="submit" class="btn" style="background:#dc3545;width:auto;padding:8px 20px;">Restart ESP32</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="footer">&copy; 2025 SensorTurtle</div>
</body>
<script>
    function checkBMEStatus() {
        fetch("/api/system/status")
        .then(function(r){return r.json();})
        .then(function(data){
            var b=document.getElementById("warningBanner");
            var t=document.getElementById("warningText");
            if(!data.bme680.ok){
                t.textContent=" – not responding (error "+data.bme680.error+"). Restart ESP32 to retry.";
                b.style.display="block";
            } else {
                b.style.display="none";
            }
        })
        .catch(function(){});
    }
    checkBMEStatus();
    setInterval(checkBMEStatus, 10000);
    document.getElementById("restartForm").addEventListener("submit",function(e){
        e.preventDefault();
        if(confirm("Restart ESP32?")){
            fetch("/restart",{method:"POST"}).then(function(){
                setTimeout(function(){window.location.reload();},5000);
            });
        }
    });
</script>
</html>
