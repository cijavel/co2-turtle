<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{deviceName}} - WLAN Settings</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
<div class="nav">
<a href="/index" class="button">Back to Index</a>
</div>
<div class="content">
<h1>WLAN Settings</h1>
<form action="/submitWLANcredentials" method="POST" id="wlanForm">
<div class="form-row">
<label for="wlanSSID">SSID</label>
<input type="text" id="wlanSSID" name="wlanSSID" value="{{ssid}}">
</div>
<div class="form-row">
<label for="wlanPASSWORD">Password</label>
<input type="password" id="wlanPASSWORD" name="wlanPASSWORD">
<button type="button" class="show-password-button" onmousedown="togglePassword(true)" onmouseup="togglePassword(false)" onmouseleave="togglePassword(false)">
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="-1 -1 16 16">
<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8a13.133 13.133 0 0 1-1.66 2.043C11.879 11.332 10.12 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.133 13.133 0 0 1 1.172 8z"/>
<path d="M8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM8 6a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
</svg>
</button>
</div>
<button type="submit" class="btn">Submit</button>
</form>
</div>
</div>
<div class="footer">&copy; 2025 SensorTurtle</div>
<script>
function togglePassword(show){document.getElementById('wlanPASSWORD').type=show?'text':'password';}
</script>
</body>
</html>
