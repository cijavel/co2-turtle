<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{deviceName}} - MQTT Settings</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
<div class="nav">
<a href="/index" class="button">Back to Index</a>
</div>
<div class="content">
<h1>MQTT Settings</h1>
<h2>Connection Status</h2>
<div class="status-item">
<div class="title">Broker</div>
<div class="data" id="statusHost">–</div>
<div class="status-indicator" id="statusIndicator"></div>
<div class="description" id="statusText">Loading...</div>
</div>
<button type="button" class="btn" id="btnCheckMqtt" style="margin-top:10px;">Check Connection</button>
<div class="form-feedback" id="feedbackMqtt"></div>
<h2>Module Switch</h2>
<form id="mqttSwitchForm">
<div class="form-row">
<label for="switchMQTT">Enable MQTT</label>
<input type="checkbox" id="switchMQTT" name="switchMQTT" {{switchMQTT_checked}}>
</div>
<button type="submit" class="btn">Save</button>
<div class="form-feedback" id="feedbackSwitch"></div>
</form>
<h2>Broker Configuration</h2>
<form id="mqttConfigForm">
<div class="form-row">
<label for="mqttHOST">Host / IP</label>
<input type="text" id="mqttHOST" name="mqttHOST" value="{{mqttHOST}}" placeholder="192.168.1.100">
</div>
<div class="form-row">
<label for="mqttPORT">Port</label>
<input type="number" id="mqttPORT" name="mqttPORT" value="{{mqttPORT}}" min="1" max="65535">
</div>
<div class="form-row">
<label for="mqttUSERen">Use Credentials</label>
<input type="checkbox" id="mqttUSERen" name="mqttUSERen" {{mqttUSERen_checked}}>
</div>
<div id="credentialsFields">
<div class="form-row">
<label for="mqttUSER">Username</label>
<input type="text" id="mqttUSER" name="mqttUSER" value="{{mqttUSER}}">
</div>
<div class="form-row">
<label for="mqttPASSWORD">Password</label>
<input type="password" id="mqttPASSWORD" name="mqttPASSWORD" placeholder="leave empty to keep current">
</div>
</div>
<button type="submit" class="btn">Save Configuration</button>
<div class="form-feedback" id="feedbackConfig"></div>
</form>
</div>
</div>
<div class="footer">&copy; 2025 SensorTurtle</div>
<script>
document.addEventListener("DOMContentLoaded",function(){
function showFeedback(id,ok){
var el=document.getElementById(id);
el.textContent=ok?"Saved successfully!":"Error saving settings.";
el.className="form-feedback "+(ok?"success":"error");
setTimeout(function(){el.textContent="";el.className="form-feedback";},3000);
}
function submitForm(url,params,id){
fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:params})
.then(function(r){showFeedback(id,r.ok);})
.catch(function(){showFeedback(id,false);});
}
function checkMqttStatus(){
var fb=document.getElementById("feedbackMqtt");
fb.textContent="Checking...";fb.className="form-feedback";
fetch("/api/mqtt/status").then(function(r){return r.json();}).then(function(data){
var host=document.getElementById("mqttHOST").value||"–";
document.getElementById("statusHost").textContent=host;
var ind=document.getElementById("statusIndicator");
var txt=document.getElementById("statusText");
if(data.connected){ind.style.backgroundColor="#28a745";txt.textContent="Connected";fb.textContent="Connected";fb.className="form-feedback success";}
else if(data.hasCredentials){ind.style.backgroundColor="#ffc107";txt.textContent="Not connected – broker configured but unreachable";fb.textContent="Broker unreachable";fb.className="form-feedback error";}
else{ind.style.backgroundColor="#dc3545";txt.textContent="Not connected – no broker configured";fb.textContent="No broker configured";fb.className="form-feedback error";}
setTimeout(function(){fb.textContent="";fb.className="form-feedback";},4000);
}).catch(function(){document.getElementById("statusText").textContent="Status unavailable";fb.textContent="Status unavailable";fb.className="form-feedback error";});}
checkMqttStatus();
document.getElementById("btnCheckMqtt").addEventListener("click", checkMqttStatus);
var mqttUSERen=document.getElementById("mqttUSERen");
var credFields=document.getElementById("credentialsFields");
function toggleCred(){credFields.style.display=mqttUSERen.checked?"block":"none";}
mqttUSERen.addEventListener("change",toggleCred);
toggleCred();
document.getElementById("mqttSwitchForm").addEventListener("submit",function(e){
e.preventDefault();
submitForm("/submitMQTTconfig","switchMQTT="+(document.getElementById("switchMQTT").checked?1:0),"feedbackSwitch");
});
document.getElementById("mqttConfigForm").addEventListener("submit",function(e){
e.preventDefault();
var inputs=document.getElementById("mqttConfigForm").querySelectorAll("input");
var params=Array.from(inputs).map(function(i){
return encodeURIComponent(i.name)+"="+(i.type==="checkbox"?(i.checked?1:0):encodeURIComponent(i.value));
}).join("&");
submitForm("/submitMQTTconfig",params,"feedbackConfig");
});
});
</script>
</body>
</html>
